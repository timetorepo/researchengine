[package]
name = "re-mobile"
version = "0.16.0-beta.1"
description = "Research Engine mobile shell (Tauri 2, iOS + Android). The Rust side is thin in R1 by design: re-* crates own the logic, this binary owns the plumbing."
edition = "2021"
license = "SEE LICENSE IN REPOSITORY README"

# Standalone package: deliberately NOT a member of ../../crates/Cargo.toml so
# `cargo test` at the crates workspace stays toolchain-light (no Tauri build).
[workspace]

[lib]
name = "re_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
re-core = { path = "../../crates/re-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["devtools"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"     # size-first: mobile resident-memory budgets (docs/mobile/10)
strip = true
