# Netlify configuration for the Research Engine website (website/).
#
# The site is a static single page built by Vite. Nothing here needs a function,
# a database or a secret: `website/scripts/prepare-assets.mjs` copies the
# portable builds out of downloads/ and writes the release manifest before Vite
# runs, so the published directory is self-contained.
#
# Deploying: connect the repository in Netlify and accept the defaults — this
# file sets the base directory, the command and the publish directory, so there
# is nothing to fill in by hand. Or run it locally:
#
#   cd website && npm ci && npm run dev

[build]
  base = "website"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# One page, many anchors.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The bundle is content-hashed by Vite, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Screenshots and avatars change only when the round does.
[[headers]]
  for = "/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/avatars/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The release manifest is small and decides what the buttons offer, so it is
# revalidated on every visit and never served stale.
[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# Downloads: long-lived files, and a filename a browser will not rename.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Disposition = "attachment"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[context.deploy-preview]
  # A preview of a pull request is not a release: keep it out of search engines.
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex"
