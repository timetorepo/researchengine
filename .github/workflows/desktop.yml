name: desktop

# Builds the Windows installer (Research Engine_<version>_x64-setup.exe) and the
# Linux bundles. The desktop app is a Tauri 2 shell around a single-file copy of
# the local server, so the runner needs no MSVC-era ceremony beyond Rust itself:
#
#   1. frontend/dist + the sidecar (Bun cross-compiles it per target)
#   2. the same binary is booted and probed — a run that cannot serve a page
#      never reaches the bundler
#   3. `tauri build --bundles nsis` → the setup.exe; the tag build attaches it
#      to the GitHub release for that tag
on:
  workflow_dispatch:
  # The installers are the one artifact nobody can check by reading a diff, so
  # they are built whenever the desktop side of the repo changes — before a tag,
  # not only on the tag. Path-filtered, so a docs or website pull request does
  # not spend twenty minutes of runner time on an installer it cannot affect.
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/desktop-*.mjs"
      - "scripts/verify-installer.mjs"
      - "scripts/ci-annotate.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the frontend and the backend bundle
        run: npm run build

      - name: Install Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compile the sidecar (single-file server, no Node on the user's machine)
        shell: bash
        env:
          BUN: ${{ steps.bun.outputs['bun-path'] }}
        run: |
          set -o pipefail
          bun --version
          node scripts/desktop-sidecar.mjs --target win-x64 2>&1 | tee sidecar.log

      - name: Explain a failed sidecar build
        if: failure()
        shell: bash
        run: node scripts/ci-annotate.mjs sidecar.log "sidecar build failed"

      - name: Prove the sidecar actually answers before installing anything
        run: node scripts/desktop-check.mjs --run
        env:
          RE_DESKTOP_PORT: "3911"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop

      - name: Build the NSIS installer
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm run tauri:build -- --bundles nsis 2>&1 | tee tauri.log

      - name: Explain a failed bundle
        if: failure() && hashFiles('desktop/tauri.log') != ''
        working-directory: desktop
        run: node ../scripts/ci-annotate.mjs tauri.log "tauri bundle failed"

      - name: Prove the installer is an installer (magic bytes, NSIS signature, size)
        run: node scripts/verify-installer.mjs windows

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Plain versions (v0.53.0) are full releases; beta tags (v0.51.0-beta.1) stay pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe

      # Best-effort: the repo's artifact storage quota can reject uploads even
      # when the build is perfect, and that must never keep a verified
      # installer off the release.
      - name: Upload the installer as a build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: research-engine-windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the frontend and the backend bundle
        run: npm run build

      - name: Install Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compile the sidecar
        env:
          BUN: ${{ steps.bun.outputs['bun-path'] }}
        run: |
          set -o pipefail
          bun --version
          node scripts/desktop-sidecar.mjs --target linux-x64 2>&1 | tee sidecar.log

      - name: Explain a failed sidecar build
        if: failure()
        run: node scripts/ci-annotate.mjs sidecar.log "sidecar build failed"

      - name: Prove the sidecar answers
        run: node scripts/desktop-check.mjs --run
        env:
          RE_DESKTOP_PORT: "3912"

      - name: System webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop

      - name: Build the bundles
        working-directory: desktop
        # The .deb is the Linux bundle. The AppImage needs linuxdeploy, which
        # fails to run on hosted runners, so it is not built here.
        run: |
          set -o pipefail
          npm run tauri:build -- --bundles deb 2>&1 | tee tauri.log

      - name: Explain a failed bundle
        if: failure() && hashFiles('desktop/tauri.log') != ''
        working-directory: desktop
        run: node ../scripts/ci-annotate.mjs tauri.log "tauri bundle failed"

      - name: Prove the bundles are bundles (ar/ELF magic, size)
        run: node scripts/verify-installer.mjs linux

      - name: Attach the bundles to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Plain versions (v0.53.0) are full releases; beta tags (v0.51.0-beta.1) stay pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            desktop/src-tauri/target/release/bundle/deb/*.deb

      # Best-effort, for the same reason as above.
      - name: Upload the bundles
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: research-engine-linux-desktop
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
