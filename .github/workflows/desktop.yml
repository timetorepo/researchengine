name: desktop

# Builds the Windows installer (Research Engine_<version>_x64-setup.exe) and the
# Linux bundles. The desktop app is a Tauri 2 shell around a single-file copy of
# the local server, so the runner needs no MSVC-era ceremony beyond Rust itself:
#
#   1. frontend/dist + the sidecar (Bun cross-compiles it per target)
#   2. `tauri build --bundles nsis` → NSIS installer, WebView2 bootstrapper
#
# Artifacts are uploaded for every run; tag builds also attach them to the
# GitHub release for that tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build --workspace frontend

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compile the sidecar (single-file server, no Node on the user's machine)
        run: node scripts/desktop-sidecar.mjs --target win-x64

      - name: Prove the sidecar actually answers before installing anything
        run: node scripts/desktop-check.mjs --run
        env:
          RE_DESKTOP_PORT: "3911"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        run: npm install --prefix desktop

      - name: Build the NSIS installer
        run: npm run tauri:build --prefix desktop -- --bundles nsis

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: research-engine-windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build --workspace frontend

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compile the sidecar
        run: node scripts/desktop-sidecar.mjs --target linux-x64

      - name: Prove the sidecar answers
        run: node scripts/desktop-check.mjs --run
        env:
          RE_DESKTOP_PORT: "3912"

      - name: System webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        run: npm install --prefix desktop

      - name: Build the bundles
        run: npm run tauri:build --prefix desktop -- --bundles deb,appimage

      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: research-engine-linux-desktop
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
