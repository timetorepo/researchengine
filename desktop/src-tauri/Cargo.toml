[package]
name = "research-engine-desktop"
version = "0.27.0-beta.1"
description = "Research Engine — privacy-first research platform (desktop shell)"
authors = ["Research Engine"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
